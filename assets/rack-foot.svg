<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 58" width="1000" height="58" role="img" aria-label="Empty slot: reserved for future bad decisions"><title>Empty slot: reserved for future bad decisions</title><defs><style>@font-face{font-family:at-mono;src:url(data:font/woff;base64,) format('woff')}.mono{font-family:at-mono,ui-monospace,monospace}.led-ok{animation:steady 2.6s steps(1) infinite}.led-act{animation:act .7s steps(1) infinite}@keyframes steady{0%,92%,100%{opacity:1}94%{opacity:.2}}@keyframes act{0%,28%{opacity:1}34%,52%{opacity:.15}58%,100%{opacity:1}}.pulse{stroke-dasharray:90 1400;animation:pulse 3.2s linear infinite}@keyframes pulse{from{stroke-dashoffset:90}to{stroke-dashoffset:-1310}}.tick{animation:tick 40s linear infinite}@keyframes tick{from{transform:translateX(0)}to{transform:translateX(var(--d))}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 .5H0M.5 0V48" fill="none" stroke="#1a1e25"/></pattern><pattern id="hatch" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><path d="M14.5 0V15" stroke="#1a1e25"/></pattern></defs><rect width="1000" height="58" fill="#0e1014"/><rect x="36.5" y="0.5" width="927" height="57" fill="url(#hatch)" stroke="#232830" stroke-width="1"/><rect x="37" y="1" width="57" height="56" fill="#0e1014"/><path d="M94.5 0V58" stroke="#232830"/><text x="65.0" y="33.0" class="mono" font-size="10" fill="#4d545e" letter-spacing="0.60" text-anchor="middle">U01</text><text x="529.0" y="33.0" class="mono" font-size="11" fill="#4d545e" letter-spacing="1.54" text-anchor="middle">EMPTY — RESERVED FOR FUTURE BAD DECISIONS</text></svg>