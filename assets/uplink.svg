<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 206" width="1000" height="206" role="img" aria-label="04 Uplink: open a connection"><title>04 Uplink: open a connection</title><defs><style>@font-face{font-family:at-disp;src:url(data:font/woff;base64,) format('woff')}.disp{font-family:at-disp,system-ui,sans-serif}@font-face{font-family:at-mono;src:url(data:font/woff;base64,) format('woff')}.mono{font-family:at-mono,ui-monospace,monospace}@font-face{font-family:at-mono6;src:url(data:font/woff;base64,) format('woff')}.mono6{font-family:at-mono6,ui-monospace,monospace}@font-face{font-family:at-sans;src:url(data:font/woff;base64,) format('woff')}.sans{font-family:at-sans,system-ui,sans-serif}.led-ok{animation:steady 2.6s steps(1) infinite}.led-act{animation:act .7s steps(1) infinite}@keyframes steady{0%,92%,100%{opacity:1}94%{opacity:.2}}@keyframes act{0%,28%{opacity:1}34%,52%{opacity:.15}58%,100%{opacity:1}}.pulse{stroke-dasharray:90 1400;animation:pulse 3.2s linear infinite}@keyframes pulse{from{stroke-dashoffset:90}to{stroke-dashoffset:-1310}}.tick{animation:tick 40s linear infinite}@keyframes tick{from{transform:translateX(0)}to{transform:translateX(var(--d))}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 .5H0M.5 0V48" fill="none" stroke="#1a1e25"/></pattern><pattern id="hatch" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><path d="M14.5 0V15" stroke="#1a1e25"/></pattern></defs><rect width="1000" height="206" fill="#0e1014"/><rect width="1000" height="206" fill="url(#grid)" opacity=".55"/><text x="36.0" y="52.0" class="mono6" font-size="13" fill="#ff5a1f" letter-spacing="1.30" text-anchor="start">04</text><text x="74.0" y="52.0" class="disp" font-size="34" fill="#e9ecef" letter-spacing="-0.17" text-anchor="start">UPLINK</text><text x="964.0" y="52.0" class="mono" font-size="11" fill="#8b9